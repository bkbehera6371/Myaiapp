name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -q -o subidha.zip
          echo "ZIP extracted."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Keystore & Build APK
        run: |
          # Create debug.keystore in root and app directory
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp debug.keystore app/ 2>/dev/null || true

          # Generate Gradle wrapper
          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            GRADLE_VER=$(grep 'distributionUrl' gradle/wrapper/gradle-wrapper.properties | sed -n 's/.*gradle-\([0-9.]*\)-.*/\1/p')
            gradle wrapper --gradle-version "$GRADLE_VER" || gradle wrapper
          else
            gradle wrapper
          fi

          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: "**/build/outputs/apk/debug/*.apk"
          
