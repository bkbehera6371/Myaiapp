name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -q -o subidha.zip
          echo "ZIP extracted."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Wrapper & Build APK
        run: |
          # Missing gradlew କୁ ଆପେ ଆପେ ତିଆରି କରିବା
          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            GRADLE_VER=$(grep 'distributionUrl' gradle/wrapper/gradle-wrapper.properties | sed -n 's/.*gradle-\([0-9.]*\)-.*/\1/p')
            echo "Detected Gradle Version: $GRADLE_VER"
            gradle wrapper --gradle-version "$GRADLE_VER" || gradle wrapper
          else
            gradle wrapper
          fi
          
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: "**/build/outputs/apk/debug/*.apk"
          
